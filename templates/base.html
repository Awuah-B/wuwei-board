<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}The Chad Blog{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
</head>
<body>
  <header>
    <a href="/" class="logo">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="The Chad Blog logo">
        <span>The Chad Blog</span>
        </a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>The Chad Blog &mdash; Thoughts  &amp; Progress</footer>
</body>
</html>
