<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}wuwei-board{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
</head>
<body>
  <div class="navbar">
    [<a href="/">Home</a>]
    {% block nav_boards %}{% endblock %}
    <span class="nav-sep">|</span>
    [<a href="/admin">Admin</a>]
  </div>

  <div class="banner">
    <a href="/"><img src="{{ url_for('static', filename='logo.png') }}" alt="wuwei-board"></a>
  </div>

  {% for message in get_flashed_messages() %}
    <div class="flash">{{ message }}</div>
  {% endfor %}

  <div class="content">
    {% block content %}{% endblock %}
  </div>

  <footer>
    wuwei-board &mdash; All posted content is the responsibility of the poster.
    <br><a href="/admin">Admin Panel</a>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
